name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # LFS objects are intentionally NOT fetched: CI never needs the Lending Club data.
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,tda]"
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Tests (synthetic fixtures only)
        run: python -m pytest -q
      - name: Synthetic end-to-end pipeline smoke test
        run: |
          python scripts/inspect_data.py --synthetic --synthetic-rows 8000
          python scripts/prepare_data.py --synthetic --synthetic-rows 8000
          python scripts/train_model.py --synthetic --feature-set all
          python scripts/evaluate_model.py --synthetic --feature-set all --bootstrap-reps 20
          python scripts/generate_reports.py --synthetic
